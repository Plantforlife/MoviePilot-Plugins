name: Publish plugin release
on:
  push:
    tags: ['FfprobeRename_v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_release.py
      - name: Check tag matches the marketplace version
        run: |
          python -c "import json,os; d=json.load(open('package.v3.json',encoding='utf-8'))['FfprobeRename']; assert os.environ['GITHUB_REF_NAME']=='FfprobeRename_v'+d['version']"
      - run: python -m pytest -q
      - run: python scripts/build_release.py
      - name: Publish archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "FFprobe命名增强 ${GITHUB_REF_NAME#FfprobeRename_v}" --notes-file docs/release-notes.md --verify-tag
